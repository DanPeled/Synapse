name: SynapseLib Dev Auto CI

on:
  push:
    branches:
      - main
    paths:
      - "synapse_lib/src/**"
      - "synapse_lib/*.gradle"
      - "versions.properties"
      - ".github/workflows/synapselib_dev_release.yml"
      - ".github/workflows/synapse_lib_release.yml"
  workflow_dispatch:

jobs:
  dev:
    uses: ./.github/workflows/synapse_lib_release.yml
    with:
      releaseVersion: dev
      forceDev: true
