name: Synapse Lib

on:
  push:
    branches: [main]
    paths:
      - "synapse_lib/src/**"
      - "synapse_lib/schema/**"
      - "synapse_lib/tools/**"
      - "synapse_lib/*.gradle"
      - "versions.properties"
  pull_request:
    paths:
      - "synapse_lib/src/**"
      - "synapse_lib/schema/**"
      - "synapse_lib/tools/**"
      - "synapse_lib/*.gradle"
      - "versions.properties"

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.lockfile', 'versions.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Build Project
        run: |
          cd synapse_lib
          ./gradlew build

  systemcore-cross-build:
    runs-on: ubuntu-latest
    container: wpilib/systemcore-cross-ubuntu:2027-24.04
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ${{ env.GRADLE_USER_HOME }}
          key: systemcore-cross-gradle-${{ hashFiles('**/*.gradle', '**/gradle.lockfile', 'versions.properties') }}
          restore-keys: |
            systemcore-cross-gradle-

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Build for SystemCore
        run: |
          cd synapse_lib
          ./gradlew build

  test:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.lockfile', 'versions.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Run Tests
        run: |
          cd synapse_lib
          ./gradlew test

  spotless-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ubuntu-latest-gradle-${{ hashFiles('**/*.gradle', '**/gradle.lockfile', 'versions.properties') }}
          restore-keys: |
            ubuntu-latest-gradle-

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Run Spotless Check
        run: |
          cd synapse_lib
          ./gradlew spotlessCheck
