name: Synapse CI

on:
  push:
    branches:
      - main
    paths:
      - "synapse_core/**"
      - "synapse_net/**"
      - "synapse_installer/**"
      - "synapse_sim/**"
      - "setup.py"
      - "MANIFEST.in"
      - "pyproject.toml"
      - ".github/workflows/synapse_ci.yml"
  pull_request:
    paths:
      - "synapse_core/**"
      - "synapse_net/**"
      - "synapse_installer/**"
      - "synapse_sim/**"
      - "setup.py"
      - "MANIFEST.in"
      - "pyproject.toml"
      - ".github/workflows/synapse_ci.yml"

jobs:
  # x86 builds (matrix)
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: [3.11, 3.12, 3.13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@v3
        with:
          node-version: "20.9.0"

      - name: Cache npm + Next.js
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            synapse_ui/node_modules
            synapse_ui/.next/cache
            synapse_sim/node_modules
          key: ${{ runner.os }}-node-20-${{ hashFiles('synapse_ui/package-lock.json', 'synapse_sim/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-

      - name: Install UI Node.js dependencies
        working-directory: synapse_ui
        run: npm ci

      - name: Install simulator Node.js dependencies
        working-directory: synapse_sim
        run: npm ci

      - name: Install Python dependencies
        run: |
          make install
          pip install ".[dev]"

      - name: Run build check
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: make build

      - name: Check wheel contents
        shell: bash
        run: |
          pip install wheel
          python - <<'EOF'
          import sys, glob, zipfile
          wheel_files = glob.glob('dist/*.whl')
          if not wheel_files:
              sys.exit("No wheel file found")
          required = [
              'synapse_sim/assets/field.glb',
              'synapse_sim/assets/apriltag-config.json',
              'synapse_sim/assets/viewer.bundle.js',
              'synapse_sim/assets/index.html',
          ]
          with zipfile.ZipFile(wheel_files[0]) as zf:
              names = zf.namelist()
              missing = [path for path in required if path not in names]
              if missing:
                  sys.exit("Wheel is missing simulator assets: " + ", ".join(missing))
              if not any(
                  name.startswith('synapse_sim/assets/apriltags/')
                  and name.endswith('.png')
                  for name in names
              ):
                  sys.exit("Wheel is missing simulator AprilTag textures")
              if 'synapse_sim/assets/field.png' in names:
                  sys.exit("Wheel contains the retired baked field.png")
              for name in sorted(names):
                  if name.startswith('synapse_sim/assets/'):
                      print(name)
          EOF

  # ARM64 builds for Jetson, Orange Pi 5, Raspberry Pi 5
  build_arm:
    strategy:
      matrix:
        include:
          - name: bookworm-arm64-3.11
            container: python:3.11-bookworm
            platform: linux/arm64
            python_version: "3.11"
          - name: bookworm-arm64-3.12
            container: python:3.12-bookworm
            platform: linux/arm64
            python_version: "3.12"
          - name: bookworm-arm64-3.13
            container: python:3.13-bookworm
            platform: linux/arm64
            python_version: "3.13"
          #
          # # Raspberry Pi 5 cross container (needs Python installed inside)
          # - name: raspberry-pi-3.11
          #   container: wpilib/raspbian-cross-ubuntu:2026-bookworm-22.04
          #   python_version: "3.11"
          # - name: raspberry-pi-3.12
          #   container: wpilib/raspbian-cross-ubuntu:2026-bookworm-22.04
          #   python_version: "3.12"
          # - name: raspberry-pi-3.13
          #   container: wpilib/raspbian-cross-ubuntu:2026-bookworm-22.04
          #   python_version: "3.13"

    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: "20.9.0"

      - name: Cache npm + Next.js
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            synapse_ui/node_modules
            synapse_ui/.next/cache
            synapse_sim/node_modules
          key: ubuntu-node-20-${{ hashFiles('synapse_ui/package-lock.json', 'synapse_sim/package-lock.json') }}
          restore-keys: |
            ubuntu-node-20-

      - run: npm ci
        working-directory: synapse_ui

      - run: npm ci
        working-directory: synapse_sim

      - name: Create Python venv
        shell: bash
        run: |
          PYTHON_CMD=$(command -v python3 || command -v python)
          $PYTHON_CMD -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python --version

      - name: Install dependencies in venv
        shell: bash
        run: |
          source .venv/bin/activate
          make install
          python -m pip install ".[dev]"

      - name: Run build check in venv
        shell: bash
        run: |
          source .venv/bin/activate
          make build

      - name: Check wheel contents in venv
        shell: bash
        run: |
          source .venv/bin/activate
          python - <<'EOF'
          import sys, glob, zipfile
          wheel_files = glob.glob('dist/*.whl')
          if not wheel_files:
              sys.exit("No wheel file found")
          required = [
              'synapse_sim/assets/field.glb',
              'synapse_sim/assets/apriltag-config.json',
              'synapse_sim/assets/viewer.bundle.js',
              'synapse_sim/assets/index.html',
          ]
          with zipfile.ZipFile(wheel_files[0]) as zf:
              names = zf.namelist()
              missing = [path for path in required if path not in names]
              if missing:
                  sys.exit("Wheel is missing simulator assets: " + ", ".join(missing))
              if not any(
                  name.startswith('synapse_sim/assets/apriltags/')
                  and name.endswith('.png')
                  for name in names
              ):
                  sys.exit("Wheel is missing simulator AprilTag textures")
              if 'synapse_sim/assets/field.png' in names:
                  sys.exit("Wheel contains the retired baked field.png")
              for name in sorted(names):
                  if name.startswith('synapse_sim/assets/'):
                      print(name)
          EOF

  # Lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          cache: pip
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: isort --check-only --diff .

  # Type-check
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          cache: pip
          python-version: "3.12"

      - run: |
          pip install ".[dev]"
      - run: pip install pyright
      - run: pyright

  # Test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      # - uses: actions/setup-node@v3
      #   with:
      #     node-version: "20.9.0"
      #
      # - name: Cache npm + Next.js
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.npm
      #       synapse_ui/node_modules
      #       synapse_ui/.next/cache
      #     key: ubuntu-node-20-${{ hashFiles('synapse_ui/package-lock.json') }}
      #     restore-keys: |
      #       ubuntu-node-20-
      #
      # - run: npm ci
      #   working-directory: synapse_ui

      - run: |
          # make install
          pip install ".[dev]"
      - run: pip install pytest

      - name: Check Chrome
        run: google-chrome --version

      - name: Run tests
        env:
          # Exercise the headless simulator renderer in CI.
          SYNAPSE_TEST_SIM_BROWSER: "1"
          # GitHub runners have no GPU, so render through SwiftShader.
          SYNAPSE_SIM_ANGLE: swiftshader
        run: make test
