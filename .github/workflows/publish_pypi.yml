name: Publish Synapse to PyPI

on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0
  workflow_dispatch: {} 

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.9.0"

      - name: Install Node.js dependencies
        working-directory: synapse_ui
        run: npm install

      - name: Install simulator Node.js dependencies
        working-directory: synapse_sim
        run: npm ci

      - name: Verify committed simulator renderer bundle
        run: |
          npm --prefix synapse_sim run build:headless
          git diff --exit-code -- \
            synapse_sim/src/synapse_sim/assets/viewer.bundle.js \
            synapse_sim/src/synapse_sim/assets/index.html

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine

      - name: Build package
        run: make build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
