name: SynapseLib Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version number"
        type: string
        required: true
      forceDev:
        description: "Force pubVersion=dev"
        type: boolean
        default: false

  workflow_call:
    inputs:
      releaseVersion:
        type: string
        required: true
      forceDev:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: write
      actions: read
      pages: write
      deployments: read
      id-token: write

    env:
      releaseVersion: ${{ inputs.releaseVersion }}
      workingDirectory: ${{ github.workspace }}/synapse_lib
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ${{ env.GRADLE_USER_HOME }}
          key: synapselib-release-gradle-${{ hashFiles('**/*.gradle', '**/gradle.lockfile', 'versions.properties') }}
          restore-keys: |
            synapselib-release-gradle-

      - name: Set release version
        run: |
          sed -i "s/^synapseVersion=.*/synapseVersion=${{ inputs.releaseVersion }}/" versions.properties
          echo "Set synapseVersion=${{ inputs.releaseVersion }}"

      - name: Force dev version
        if: ${{ inputs.forceDev }}
        run: |
          sed -i 's/^synapseVersion=.*/synapseVersion=dev/' versions.properties
          echo "Forced synapseVersion=dev"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: ${{ env.workingDirectory }}

      - name: Install SystemCore toolchain
        run: ./gradlew installSystemCoreToolchain
        working-directory: ${{ env.workingDirectory }}

      - name: Build synapse_lib
        run: ./gradlew build
        working-directory: ${{ env.workingDirectory }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ${{ env.workingDirectory }}/vendordep/

      - name: Gradle Publish
        run: ./gradlew publish
        working-directory: ${{ env.workingDirectory }}

      - name: Create versioned vendor JSON
        run: |
          cp SynapseLib.json SynapseLib-${{ inputs.releaseVersion }}.json
        working-directory: ${{ env.workingDirectory }}/vendordep/

      - name: Commit and push gh-pages updates
        run: |
          git add .
          git commit -m "Automatically add SynapseLib version ${{ inputs.releaseVersion }}"
          git push
        working-directory: ${{ env.workingDirectory }}/vendordep/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          retention-days: 90
          path: ${{ env.workingDirectory }}/vendordep/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Output Pages Tree
        run: find ${{ env.workingDirectory }}/vendordep/ -type f
