#
# Synapse device image registry.
#
# This file is the single place to add a board. Every [target.<id>] section
# becomes one entry in the release workflow matrix.
#
# Adding a board to an existing platform (for example a new Orange Pi):
#
#   [target.orangepi5-max]
#   platform = orangepi
#   name = Orange Pi 5 Max
#   env.BOARD = orangepi5-max
#
# Adding a new platform:
#
#   1. Create synapse_imager/<platform>/build.sh (and an optional setup.sh for
#      host dependencies).
#   2. Add a [platform.<id>] section below.
#   3. Add one or more [target.<id>] sections that reference it.
#
# Platform keys:
#   name        Human-readable platform name (required).
#   builder     Build script, relative to synapse_imager/ (required).
#   setup       Optional host setup script, relative to synapse_imager/.
#   runner      GitHub Actions runner label. Default: ubuntu-24.04.
#   timeout     Job timeout in minutes. Default: 360.
#   free_disk   Free runner disk space before building. Default: true.
#   artifact    Artifact name. Default: synapse-<target>.
#   env.<NAME>  Environment default for every target on the platform.
#
# Target keys:
#   platform    Parent platform id (required).
#   name        Human-readable target name (required).
#   env.<NAME>  Environment default passed to the builder. Shell environment
#               wins, so local overrides still work.
#   runner, timeout, free_disk, artifact
#               Optional per-target overrides of the platform values.

[defaults]
runner = ubuntu-24.04
timeout = 360
free_disk = true

# Raspberry Pi OS builds one 64-bit image for every supported Pi model.
[platform.raspberrypi]
name = Raspberry Pi
builder = raspberrypi/build.sh
setup = raspberrypi/setup.sh
artifact = synapse-raspberrypi

[target.raspberrypi]
platform = raspberrypi
name = Raspberry Pi 3 / 4 / 5 / Zero 2 W (64-bit)
env.RELEASE = bookworm
env.PI_GEN_REF = 2026-10-06-raspios-bookworm-arm64
env.USE_DOCKER = 1

# Armbian builds one image per board. Add a [target.<board>] section to support
# another board; the workflow matrix picks it up automatically.
[platform.orangepi]
name = Orange Pi
builder = orangepi/build.sh
env.PREFER_DOCKER = yes

[target.orangepi5]
platform = orangepi
name = Orange Pi 5
env.BOARD = orangepi5

[target.orangepi5-plus]
platform = orangepi
name = Orange Pi 5 Plus
env.BOARD = orangepi5-plus

# Jetson produces a rootfs overlay rather than a flashable image because the
# NVIDIA BSP cannot be redistributed from CI.
[platform.jetson]
name = Jetson
builder = jetson/build.sh
runner = ubuntu-latest
timeout = 60
free_disk = false
artifact = synapse-jetson

[target.jetson]
platform = jetson
name = Jetson (JetPack/L4T overlay)
