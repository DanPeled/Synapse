import org.wpilib.toolchain.*

plugins {
    id 'cpp'
    id 'java'
    id 'google-test-test-suite'
    id 'org.wpilib.NativeUtils'
    id 'org.wpilib.GradleJni'
    id 'org.wpilib.GradleRIO'
    id 'org.wpilib.GradleVsCode'
    id 'com.diffplug.spotless'
}

ext.versions = new Properties()
file("$rootDir/../versions.properties").withInputStream { versions.load(it) }

group = 'synapse.vision'
version = versions.synapseVersion

// WPILib Version
ext.wpilibVersion = versions.wpilibVersion

repositories {
    mavenCentral()
}

// GradleRIO provides the WPILib repositories. The 2027 alpha artifacts are only
// published to the development repository.
wpi.maven.useDevelopment = !project.hasProperty('releaseMode')

java {
    sourceCompatibility = JavaVersion.toVersion(versions.javaVersion)
    targetCompatibility = JavaVersion.toVersion(versions.javaVersion)
}
var javaVersion = versions.javaVersion

apply from: 'config.gradle'

// Apply Java configuration
dependencies {
    implementation "org.wpilib.cscore:cscore-java:$wpilibVersion"
    implementation "org.wpilib.cameraserver:cameraserver-java:$wpilibVersion"
    implementation "org.wpilib.ntcore:ntcore-java:$wpilibVersion"
    implementation "org.wpilib.wpilibj:wpilibj-java:$wpilibVersion"
    implementation "org.wpilib.wpiutil:wpiutil-java:$wpilibVersion"
    implementation "org.wpilib.wpimath:wpimath-java:$wpilibVersion"
    implementation "org.wpilib.wpiunits:wpiunits-java:$wpilibVersion"
    implementation "org.wpilib.hal:hal-java:$wpilibVersion"
    implementation "org.wpilib.telemetry:telemetry-java:$wpilibVersion"
    implementation "org.ejml:ejml-simple:$versions.ejmlVersion"
    implementation "com.fasterxml.jackson.core:jackson-annotations:$versions.jacksonVersion"
    implementation "com.fasterxml.jackson.core:jackson-core:$versions.jacksonVersion"
    implementation "com.fasterxml.jackson.module:jackson-module-parameter-names:$versions.jacksonVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:$versions.jacksonVersion"
    implementation "com.fasterxml.jackson.core:jackson-databind:$versions.jacksonVersion"
    implementation "org.wpilib.thirdparty.opencv:opencv-java:$versions.opencvVersion"

    implementation "org.msgpack:jackson-dataformat-msgpack:$versions.msgpackVersion"
    implementation "org.msgpack:msgpack-core:$versions.msgpackVersion"
    annotationProcessor "org.msgpack:jackson-dataformat-msgpack:$versions.msgpackVersion"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    // WPILib geometry classes use QuickBuf for their protobuf serializers.
    testImplementation "us.hebi.quickbuf:quickbuf-runtime:$versions.quickbufVersion"
}

// Set up Java tests
test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
    options.encoding = 'UTF-8'
}

// Setup Javadocs to link back to WPILib docs
javadoc {
    destinationDir = file("vendordep/docs")
    title = "Synapse"
    options {
        links "https://docs.oracle.com/en/java/javase/$javaVersion/docs/api/", 'https://github.wpilib.org/allwpilib/docs/release/java/'
    }
}

ext.getCurrentArch = {
    return NativePlatforms.desktop
}

spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/build-*/**', '**/bin/**'
        }
        toggleOffOn()
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree('.') {
            include '**/*.gradle'
            exclude '**/build/**', '**/build-*/**'
        }
        greclipse()
        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'xml', {
        target fileTree('.') {
            include '**/*.xml'
            exclude '**/build/**', '**/build-*/**'
        }
        eclipseWtp('xml')
        trimTrailingWhitespace()
        indentWithSpaces(2)
        endWithNewline()
    }
    format 'misc', {
        target fileTree('.') {
            include '**/*.md', '**/.gitignore'
            exclude '**/build/**', '**/build-*/**'
        }
        trimTrailingWhitespace()
        indentWithSpaces(2)
        endWithNewline()
    }
}

apply from: 'publish.gradle'

wrapper {
    gradleVersion versions.gradleVersion
}

tasks.named('spotlessGroovyGradle') {
    dependsOn tasks.named('javadoc')
}

tasks.named('spotlessJava') {
    dependsOn tasks.named('javadoc')
}

tasks.named('spotlessMisc') {
    dependsOn tasks.named('javadoc')
}

tasks.named('spotlessXml') {
    dependsOn tasks.named('javadoc')
}
