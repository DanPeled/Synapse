import org.gradle.internal.os.OperatingSystem

pluginManagement {
    def versions = new Properties()
    file('../versions.properties').withInputStream { versions.load(it) }

    repositories {
        String wpilibYear = versions.frcYear
        File frcHome
        if (OperatingSystem.current().isWindows()) {
            String publicFolder = System.getenv('PUBLIC')
            if (publicFolder == null) {
                publicFolder = "C:\\Users\\Public"
            }
            def homeRoot = new File(publicFolder, "wpilib")
            frcHome = new File(homeRoot, wpilibYear)
        } else {
            def userFolder = System.getProperty("user.home")
            def homeRoot = new File(userFolder, "wpilib")
            frcHome = new File(homeRoot, wpilibYear)
        }
        def frcHomeMaven = new File(frcHome, 'maven')
        maven {
            name = 'frcHome'
            url = frcHomeMaven
        }
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
    }

    resolutionStrategy {
        eachPlugin {
            switch (requested.id.id) {
                case 'org.wpilib.GradleRIO':
                    useVersion(versions.gradleRioVersion)
                    break
                case 'com.diffplug.spotless':
                    useVersion(versions.spotlessVersion)
                    break
            }
        }
    }
}

Properties props = System.getProperties();
props.setProperty("org.gradle.internal.native.headers.unresolved.dependencies.ignore", "true");
includeBuild('../synapse_lib')
