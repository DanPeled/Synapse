# Single source of truth for Synapse and WPILib versions.
#
# Edit this file to bump a version, then run `python3 scripts/sync_versions.py`
# to regenerate the checked-in Python version module. Gradle and the Python
# packaging metadata read this file directly.

# Synapse releases (must match across Java library, Python package, and vendordep)
synapseVersion=2027.0.0a1
synapsePythonVersion=2027.0.0a1

# WPILib releases. The Java and Python ecosystems use different version schemes.
wpilibVersion=2027.0.0-alpha-8
# RobotPy a7+ native wheels require glibc 2.41 and Python >=3.12. a6 is the
# newest alpha compatible with the repository's Python 3.11 CI matrix.
wpilibPythonVersion=2027.0.0a6
wpilibYear=2027
# Year used by vendordeps and the local WPILib installation directory.
frcYear=2027_alpha7

# Gradle plugins
gradleRioVersion=2027.0.0-alpha-8
nativeUtilsVersion=2027.14.3
gradleJniVersion=2027.0.0
gradleVsCodeVersion=2027.0.0
spotlessVersion=8.11.0

# Build toolchain
javaVersion=25
gradleVersion=9.2.0

# Java dependencies shared with the published vendordep
jacksonVersion=2.15.2
msgpackVersion=0.9.10
ejmlVersion=0.46.0
quickbufVersion=1.4
opencvVersion=2027-4.13.0-4
